  Firebase (Firestore) — carregado via CDN como ES module, sem Node/NPM.
  Só inicializa o app e o banco; a coleta do Analytics não é usada aqui.
  O restante da aplicação (fim do <body>) é um script clássico (não-module)
  por depender de escopo compartilhado entre dezenas de funções; por isso ele
  não importa o Firestore diretamente — em vez disso, este módulo expõe o que
  for necessário em `window.__firestore` e dispara o evento "firebase-ready",
  que o script principal escuta antes de ligar os listeners em tempo real.
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot

    projectId: "gestao-alia",

    messagingSenderId: "746682094353",
    appId: "1:746682094353:web:f19f407bc6c58388a6f2b0",
    measurementId: "G-K6M6LT3ZCS"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getFirestore(firebaseApp);

  window.__firestore = { db: db, collection: collection, doc: doc, addDoc: addDoc, updateDoc: updateDoc, deleteDoc: deleteDoc, onSnapshot: onSnapshot };
  window.dispatchEvent(new CustomEvent('firebase-ready'));
</script>

function formatDateBr(iso) {
  if (!iso) return '';
  var p = iso.slice(0, 10).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
}
function formatDateTimeBr(v) {
  if (!v) return '';
  var d = new Date(v);
  if (isNaN(d.getTime())) return v;
  var dd = String(d.getDate()).padStart(2, '0');
  var mm = String(d.getMonth() + 1).padStart(2, '0');
  var hh = String(d.getHours()).padStart(2, '0');
  var mi = String(d.getMinutes()).padStart(2, '0');
  return dd + '/' + mm + ' ' + hh + ':' + mi;
}
function formatDuration(mins) {
  if (mins == null || isNaN(mins) || mins < 0) return '';
  if (mins < 60) return mins + ' min';
  var h = Math.floor(mins / 60), m = mins % 60;
  return h + 'h' + (m ? ' ' + m + 'min' : '');
}
function minutesBetween(startIso, endIso) {
  if (!startIso || !endIso) return null;
  var diff = (new Date(endIso).getTime() - new Date(startIso).getTime()) / 60000;
  return diff >= 0 ? Math.round(diff) : null;
}

/* O Firestore não aceita arrays aninhados (array dentro de array), então a
   grade 2D das planilhas "genéricas" (usada em toda a renderização/edição
   local) é convertida para um mapa plano { linhas, colunas, celulas:{"r-c":valor} }
   só no momento de gravar, e reconstruída de volta como array 2D ao ler. */
function gridToFirestoreFields(dados) {
  var celulas = {};
  dados.forEach(function (row, r) { row.forEach(function (cell, c) { celulas[r + '-' + c] = cell; }); });
  return { linhas: dados.length, colunas: dados.length ? dados[0].length : 0, celulas: celulas };
}
function firestoreFieldsToGrid(fields) {
  var linhas = fields.linhas || 0, colunas = fields.colunas || 0, celulas = fields.celulas || {};
  var grid = [];
  for (var r = 0; r < linhas; r++) {
    var row = [];
    for (var c = 0; c < colunas; c++) row.push(celulas[r + '-' + c] || '');
    grid.push(row);
  }
  return grid;
}

/* O link de compartilhamento do Google Sheets sempre traz o ID entre "/d/"
   e a próxima barra (geralmente "/edit"), ex.:
   https://docs.google.com/spreadsheets/d/ESSE_TRECHO_AQUI/edit#gid=0 */
function extractGoogleSheetId(link) {
  var match = String(link || '').match(/\/d\/([a-zA-Z0-9-_]+)/);
  return match ? match[1] : null;
}
function createGoogleSheetRecord(nome, sheetId) {

    .catch(function (err) { return reportDataError(err, 'Não foi possível importar a planilha do Google Sheets.'); });

/* Lê um arquivo .xlsx/.xls/.csv no navegador (SheetJS) e devolve a primeira
   aba já como matriz 2D — mesmo formato usado pelas planilhas "genéricas",
   o que permite reaproveitar gridToFirestoreFields para gravar no Firestore.
   codepage:65001 (UTF-8) evita "TÃ©cnico" no lugar de "Técnico" ao ler .csv
   — sem isso o SheetJS interpreta os bytes UTF-8 como Latin-1. defval:''
   evita células vazias como `undefined` (o Firestore rejeita valores
   undefined em addDoc/updateDoc). */
function readSpreadsheetFile(file) {
  return new Promise(function (resolve, reject) {
    var reader = new FileReader();
    reader.onerror = function () { reject(reader.error || new Error('Falha ao ler o arquivo.')); };
    reader.onload = function () {
      try {
        var workbook = XLSX.read(reader.result, { type: 'array', codepage: 65001 });
        var worksheet = workbook.Sheets[workbook.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' }));
      } catch (err) { reject(err); }
    };
    reader.readAsArrayBuffer(file);
  });
}
function createExcelImportRecord(nome, dados) {

  var payload = { nome: nome, tipo: 'excel-import', criadaEm: todayIso(), linhas: flat.linhas, colunas: flat.colunas, celulas: flat.celulas };
  return fsAddDoc(fsCollection(db, 'spreadsheets'), payload).then(function () { return true; })
    .catch(function (err) { return reportDataError(err, 'Não foi possível importar a planilha.'); });
}

/* ============================================================
   SINCRONIZAÇÃO EM TEMPO REAL — onSnapshot + carga inicial (seed)
   ============================================================ */
var seedGuard = { technicians: false, spreadsheets: false };

function stripId(obj) { var copy = Object.assign({}, obj); delete copy.id; return copy; }

/* Seeds de planilha genérica trazem `dados` como array 2D (conveniente de
   ler/manter no código-fonte); aqui ele é achatado para o formato aceito
   pelo Firestore antes da gravação (ver gridToFirestoreFields). */
function sheetToFirestorePayload(sheet) {
  var copy = stripId(sheet);
  if (copy.tipo === 'generic' && Array.isArray(copy.dados)) {
    var flat = gridToFirestoreFields(copy.dados);
    delete copy.dados;
    copy.linhas = flat.linhas; copy.colunas = flat.colunas; copy.celulas = flat.celulas;
  }
  return copy;
}

function seedTechniciansToFirestore() {
  Promise.all(seedTechnicians().map(function (t) { return fsAddDoc(fsCollection(db, 'technicians'), stripId(t)); }))
    .catch(function (err) { reportDataError(err, 'Não foi possível popular os técnicos iniciais.'); });
}
function seedSpreadsheetsToFirestore() {
  Promise.all(seedSpreadsheets().map(function (s) { return fsAddDoc(fsCollection(db, 'spreadsheets'), sheetToFirestorePayload(s)); }))
    .catch(function (err) { reportDataError(err, 'Não foi possível popular as planilhas iniciais.'); });
}
function resetDemoData() {
  // Trava o seed-guard antes de apagar: sem isso, o esvaziamento momentâneo
  // das coleções dispara o auto-seed do onSnapshot em paralelo com o reseed
  // abaixo, duplicando tudo.
  seedGuard.technicians = true; seedGuard.spreadsheets = true;
  return Promise.all(STATE.technicians.map(function (t) { return fsDeleteDoc(fsDoc(db, 'technicians', t.id)); }))
    .then(function () { return Promise.all(STATE.spreadsheets.map(function (s) { return fsDeleteDoc(fsDoc(db, 'spreadsheets', s.id)); })); })
    .then(function () { return Promise.all(seedTechnicians().map(function (t) { return fsAddDoc(fsCollection(db, 'technicians'), stripId(t)); })); })
    .then(function () { return Promise.all(seedSpreadsheets().map(function (s) { return fsAddDoc(fsCollection(db, 'spreadsheets'), sheetToFirestorePayload(s)); })); })
    .then(function () { return true; })
    .catch(function (err) { return reportDataError(err, 'Não foi possível restaurar os dados de demonstração.'); });
}

function initFirestoreListeners() {
  fsOnSnapshot(fsCollection(db, 'technicians'), function (snap) {
    STATE.technicians = snap.docs.map(function (d) { return Object.assign({}, d.data(), { id: d.id }); });
    session.techniciansLoaded = true;
    if (snap.empty && !seedGuard.technicians) { seedGuard.technicians = true; seedTechniciansToFirestore(); }
    handleTechniciansUpdate();
  }, function (err) {
    console.error('Falha ao sincronizar técnicos', err);
    showToast('Falha ao sincronizar técnicos com o Firestore. Verifique as regras de segurança do projeto.', 'error');
  });

  fsOnSnapshot(fsCollection(db, 'spreadsheets'), function (snap) {
    STATE.spreadsheets = snap.docs.map(function (d) {
      var sheet = Object.assign({}, d.data(), { id: d.id });
      if (sheet.tipo === 'generic' || sheet.tipo === 'excel-import') {
        sheet.dados = firestoreFieldsToGrid(sheet);
        delete sheet.linhas; delete sheet.colunas; delete sheet.celulas;
      }
      return sheet;
    });
    session.spreadsheetsLoaded = true;
    if (snap.empty && !seedGuard.spreadsheets) { seedGuard.spreadsheets = true; seedSpreadsheetsToFirestore(); }
    handleSpreadsheetsUpdate();
  }, function (err) {

/* ============================================================
   ALERTAS (dashboard)
   ============================================================ */
function computeAlerts(techs) {
  var alerts = [];
  var pending = 0;
  techs.forEach(function (t) { t.treinamentos.forEach(function (e) { if (e.status === 'pendente') pending++; }); });
  if (pending > 0) alerts.push({ level: 'warning', text: pending + ' treinamento(s) pendente(s) na equipe.' });
  techs.forEach(function (t) { if (t.metricas.slaPercentual < 90) alerts.push({ level: 'critical', text: t.nome + ' está com SLA abaixo de 90% (' + t.metricas.slaPercentual + '%).' }); });
  var now = new Date();
  techs.forEach(function (t) {
    if (!t.timeline.length) { alerts.push({ level: 'info', text: 'Nenhum acompanhamento registrado ainda para ' + t.nome + '.' }); return; }
    var last = t.timeline.reduce(function (latest, e) { return (!latest || e.inicio > latest) ? e.inicio : latest; }, null);
    var days = Math.floor((now - new Date(last)) / 86400000);
    if (days > 21) alerts.push({ level: 'info', text: 'Sem acompanhamento recente para ' + t.nome + ' (há ' + days + ' dias).' });
  });
  return alerts;
}
function alertsListHtml(alerts) {
  if (!alerts.length) return '<p class="text-sm text-gray-500 italic">Nenhum alerta no momento.</p>';
  var dot = { info: 'bg-trblue', warning: 'bg-amber-500', critical: 'bg-red-600' };
  return '<ul class="flex flex-col gap-2">' + alerts.map(function (a) {
    return '<li class="flex items-center gap-2.5 text-sm text-gray-800 bg-trbg px-3 py-2 rounded-lg"><span class="w-2 h-2 rounded-full shrink-0 ' + dot[a.level] + '"></span>' + escapeHtml(a.text) + '</li>';
  }).join('') + '</ul>';
}

/* ============================================================
   INTEGRAÇÃO — Genesys Cloud Analytics API
   Alimenta o Cockpit OPS com dados reais (conversas e presença dos
   técnicos), consumidos direto do navegador via fetch() com Bearer Token.

   PROTÓTIPO: GENESYS_TOKEN é o token de sessão do usuário (copiado
   manualmente do Genesys Cloud), então expira rápido — atualize a
   variável abaixo antes de cada apresentação. Em produção, troque para
   um fluxo onde um backend guarda a Client Secret (OAuth Client
   Credentials) e devolve só um token de curta duração para o front-end;
   uma Secret Key nunca deve ficar hardcoded num arquivo servido ao
   navegador.

   CORS: o Genesys Cloud só aceita chamadas de origens autorizadas.
   Se o fetch falhar sem nem chegar a um status HTTP (erro de rede/CORS
   no console), cadastre a origem em que este dashboard roda (ex.:
   http://localhost:8123) em Admin > Integrações > CORS no Genesys Cloud.
   ============================================================ */

// Cole aqui o Bearer Token atual (sem o prefixo "Bearer "). Único lugar do
// código que precisa ser tocado para renovar a sessão.
var GENESYS_TOKEN = 'COLE_SEU_BEARER_TOKEN_AQUI';

// Domínio da API conforme a região do org Genesys Cloud (ver Admin >
// Configurações da conta > Região). Alguns exemplos comuns:
//   Américas (leste)  -> https://api.mypurecloud.com
//   Américas (oeste)  -> https://api.usw2.pure.cloud
//   América do Sul    -> https://api.sa1.pure.cloud
//   Europa (Irlanda)  -> https://api.mypurecloud.ie
var GENESYS_API_BASE = 'https://api.mypurecloud.com';

// Qualifiers de "tSystemPresence" considerados tempo disponível/produtivo;
// todo o restante (BUSY, AWAY, BREAK, MEAL, MEETING, TRAINING, OFFLINE...)
// entra no cálculo de "Indisponibilidade". São os valores padrão do
// sistema Genesys (não os nomes customizados da presença), então valem
// para qualquer org.
var GENESYS_AVAILABLE_PRESENCES = ['AVAILABLE', 'ON_QUEUE'];

var GENESYS_STATE = { error: null, lastUpdated: null };
var GENESYS_QUEUE_NAME_CACHE = {};

/* Wrapper único do fetch(): injeta os headers exigidos (Authorization +
   Content-Type) e centraliza o tratamento de 401. Qualquer chamada nova à
   API do Genesys deve passar por aqui — nunca chamar fetch() direto. */
function genesysFetch(path, options) {
  options = options || {};
  options.headers = { 'Authorization': 'Bearer ' + GENESYS_TOKEN, 'Content-Type': 'application/json' };
  return fetch(GENESYS_API_BASE + path, options).then(function (res) {
    if (res.status === 401) {
      var authErr = new Error('Sessão expirada. Por favor, atualize o Token no código.');
      authErr.isGenesysAuthError = true;
      throw authErr;
    }
    if (!res.ok) {
      return res.text().then(function (body) {
        throw new Error('Erro Genesys Cloud (' + res.status + '): ' + (body || res.statusText));
      });
    }
    return res.status === 204 ? null : res.json();
  });
}
function genesysPost(path, body) { return genesysFetch(path, { method: 'POST', body: JSON.stringify(body) }); }
function genesysGet(path) { return genesysFetch(path, { method: 'GET' }); }

/* -------- utilitários de tempo -------- */
// Milissegundos -> "MM:SS" (ou "HH:MM:SS" quando passa de 1h).
function msToClock(ms) {
  var totalSec = Math.max(0, Math.round((ms || 0) / 1000));
  var h = Math.floor(totalSec / 3600), m = Math.floor((totalSec % 3600) / 60), s = totalSec % 60;
  var pad = function (n) { return String(n).padStart(2, '0'); };
  return h > 0 ? (h + ':' + pad(m) + ':' + pad(s)) : (pad(m) + ':' + pad(s));
}
// Milissegundos -> "1min 42s", estilo compacto usado nos cards de KPI.
function msToShort(ms) {
  var totalSec = Math.max(0, Math.round((ms || 0) / 1000));
  var m = Math.floor(totalSec / 60), s = totalSec % 60;
  return m > 0 ? (m + 'min ' + s + 's') : (s + 's');
}
// Intervalo padrão do Cockpit: das 08h de hoje até agora (cai para as
// últimas 10h se ainda não passou das 08h) — formato ISO-8601 UTC exigido
// pela API ("Z" já vem de toISOString()).
function genesysDashboardInterval() {
  var now = new Date();
  var start = new Date(now); start.setHours(8, 0, 0, 0);
  if (now < start) start = new Date(now.getTime() - 10 * 3600 * 1000);
  return start.toISOString() + '/' + now.toISOString();
}
function formatHourLabel(intervalStr) {
  var d = new Date((intervalStr || '').split('/')[0]);
  return isNaN(d) ? '' : String(d.getHours()).padStart(2, '0') + 'h';
}

/* -------- leitura da resposta de aggregates/query --------
   Cada "data point" (um bucket, com ou sem granularity) traz metrics: um
   array de { metric, qualifier?, stats: { count, sum, min, max } }. */
function metricStat(dataPoint, metricName, statKey) {
  return (dataPoint.metrics || []).reduce(function (total, m) {
    if (m.metric !== metricName) return total;
    return total + (m.stats && typeof m.stats[statKey] === 'number' ? m.stats[statKey] : 0);
  }, 0);
}
// Para métricas com "qualifier" (ex.: tSystemPresence quebrado por status):
// devolve { AVAILABLE: 120000, BREAK: 30000, ... } somando o tempo (sum).
function sumByQualifier(dataPoint, metricName) {
  var out = {};
  (dataPoint.metrics || []).forEach(function (m) {
    if (m.metric !== metricName) return;
    var q = m.qualifier || 'DESCONHECIDO';
    out[q] = (out[q] || 0) + (m.stats && m.stats.sum || 0);
  });
  return out;
}

/* -------- 1) Volume, TMA e TME + 2) filas mais atendidas --------
   Mesmo endpoint (POST /conversations/aggregates/query); o que muda é
   granularity (para série temporal) x groupBy (para separar por fila). */
function fetchConversationsAggregates(interval, opts) {
  opts = opts || {};
  var body = { interval: interval, metrics: ['nOffered', 'nAnswered', 'nAbandon', 'tHandle', 'tAnswered', 'tAcd'] };
  if (opts.granularity) body.granularity = opts.granularity;
  if (opts.groupBy) body.groupBy = opts.groupBy;
  return genesysPost('/api/v2/analytics/conversations/aggregates/query', body);
}
// Resolve queueId -> nome real via GET /routing/queues/{id}, com cache em
// memória (os IDs não mudam, não precisa buscar de novo a cada refresh).
function resolveQueueNames(queueIds) {
  var missing = queueIds.filter(function (id) { return id && !GENESYS_QUEUE_NAME_CACHE[id]; });
  if (!missing.length) return Promise.resolve(GENESYS_QUEUE_NAME_CACHE);
  return Promise.all(missing.map(function (id) {
    return genesysGet('/api/v2/routing/queues/' + id)
      .then(function (q) { GENESYS_QUEUE_NAME_CACHE[id] = q.name || id; })
      .catch(function () { GENESYS_QUEUE_NAME_CACHE[id] = id; });
  })).then(function () { return GENESYS_QUEUE_NAME_CACHE; });
}
function fetchTopQueues(interval, topN) {
  return fetchConversationsAggregates(interval, { groupBy: ['queueId'] }).then(function (json) {
    var rows = (json.results || [])
      .map(function (r) {
        var data = (r.data && r.data[0]) || {};
        return { queueId: r.group && r.group.queueId, nOffered: metricStat(data, 'nOffered', 'count') };
      })
      .filter(function (r) { return r.queueId; })
      .sort(function (a, b) { return b.nOffered - a.nOffered; })
      .slice(0, topN || 5);
    return resolveQueueNames(rows.map(function (r) { return r.queueId; })).then(function (names) {
      rows.forEach(function (r) { r.name = names[r.queueId] || r.queueId; });
      return rows;
    });
  });
}

/* -------- 3) Indisponibilidade total (POST /users/aggregates/query) -------- */
function fetchUsersPresenceAggregates(interval, opts) {
  opts = opts || {};
  var body = { interval: interval, metrics: ['tSystemPresence'] };
  if (opts.granularity) body.granularity = opts.granularity;
  if (opts.groupBy) body.groupBy = opts.groupBy;
  return genesysPost('/api/v2/analytics/users/aggregates/query', body);
}
// A partir de um data point, devolve a % de tempo fora de
// GENESYS_AVAILABLE_PRESENCES em relação ao total de tempo com presença
// registrada nesse bucket.
function unavailabilityPercent(dataPoint) {
  var byQualifier = sumByQualifier(dataPoint, 'tSystemPresence');
  var total = 0, unavailable = 0;
  Object.keys(byQualifier).forEach(function (q) {
    total += byQualifier[q];
    if (GENESYS_AVAILABLE_PRESENCES.indexOf(q) === -1) unavailable += byQualifier[q];
  });
  return total ? (unavailable / total) * 100 : 0;
}

/* -------- 4) Timeline exata de indisponibilidade de um técnico --------
   POST /users/details/query devolve, por usuário, o array routingStatus
   (troca de status de roteamento) com startTime/endTime exatos. */
function fetchUserRoutingTimeline(userId, interval) {
  var body = {
    interval: interval,
    userFilters: [{ type: 'or', predicates: [{ type: 'dimension', dimension: 'userId', operator: 'matches', value: userId }] }]
  };
  return genesysPost('/api/v2/analytics/users/details/query', body).then(function (json) {
    var user = (json.userDetails || [])[0];
    return (user && user.routingStatus) || [];
  });
}

/* Plugin local (não-global) que desenha um texto centralizado sobre o
   donut — usado para marcar "100%" no meio do gráfico de status. */
var cockpitCenterTextPlugin = {
  id: 'cockpitCenterText',
  afterDraw: function (chart) {
    var cfg = chart.config.options.plugins && chart.config.options.plugins.centerText;
    if (!cfg) return;
    var ctx = chart.ctx, w = chart.width, h = chart.height;
    ctx.save();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 22px Inter, system-ui, sans-serif';
    ctx.fillStyle = cfg.color || '#011B36';
    ctx.fillText(cfg.text, w / 2, h / 2 - 8);
    if (cfg.subtext) {
      ctx.font = '600 11px Inter, system-ui, sans-serif';
      ctx.fillStyle = '#6b7280';
      ctx.fillText(cfg.subtext, w / 2, h / 2 + 12);
    }
    ctx.restore();
  }
};

/* Busca os dados reais no Genesys Cloud (2 aggregates + 1 grouped query) e
   alimenta KPIs + gráficos. Chamada pelo renderView() ao entrar no Cockpit
   e pelo botão "Atualizar". Qualquer erro de rede/API cai no catch — 401
   vira a mensagem amigável no banner; outros erros mostram um aviso
   genérico e os gráficos ficam zerados (nunca quebram a tela). */
async function loadCockpitGenesysData() {
  GENESYS_STATE.error = null;
  updateGenesysBanner();
  var interval = genesysDashboardInterval();

  try {
    var results = await Promise.all([
      fetchConversationsAggregates(interval, { granularity: 'PT1H' }),
      fetchUsersPresenceAggregates(interval, { granularity: 'PT1H' }),
      fetchTopQueues(interval, 5)
    ]);
    renderCockpitFromGenesysData(results[0], results[1], results[2]);
    GENESYS_STATE.lastUpdated = new Date();
  } catch (err) {
    console.error('Falha ao carregar dados do Genesys Cloud:', err);
    GENESYS_STATE.error = err.isGenesysAuthError
      ? err.message
      : 'Não foi possível carregar os dados do Genesys Cloud agora. Verifique o token e a conexão, depois clique em "Atualizar".';
    updateGenesysBanner();
    drawCockpitCharts({ mainLabels: [], volume: [], tmaMin: [], queueLabels: [], queueData: [], unavailLabels: [], unavailPct: [], donutData: [0, 0] });
  }
}

/* Reduz as 3 respostas do Genesys (conversas com granularity, presença com
   granularity, filas agrupadas) para os números exibidos nos KPIs e os
   arrays que os 4 gráficos do Cockpit esperam. */
function renderCockpitFromGenesysData(conversationsJson, usersJson, queueRows) {
  var convBuckets = (conversationsJson.results && conversationsJson.results[0] && conversationsJson.results[0].data) || [];
  var mainLabels = convBuckets.map(function (b) { return formatHourLabel(b.interval); });
  var volume = convBuckets.map(function (b) { return metricStat(b, 'nOffered', 'count'); });
  var tmaMin = convBuckets.map(function (b) {
    var sum = metricStat(b, 'tHandle', 'sum'), count = metricStat(b, 'tHandle', 'count');
    return count ? +(sum / count / 60000).toFixed(2) : 0;
  });

  var totalOffered = volume.reduce(function (a, b) { return a + b; }, 0);
  var totalAnswered = convBuckets.reduce(function (s, b) { return s + metricStat(b, 'nAnswered', 'count'); }, 0);
  var totalAbandon = convBuckets.reduce(function (s, b) { return s + metricStat(b, 'nAbandon', 'count'); }, 0);
  var tHandleSum = convBuckets.reduce(function (s, b) { return s + metricStat(b, 'tHandle', 'sum'); }, 0);
  var tHandleCount = convBuckets.reduce(function (s, b) { return s + metricStat(b, 'tHandle', 'count'); }, 0);
  var tWaitSum = convBuckets.reduce(function (s, b) { return s + (metricStat(b, 'tAnswered', 'sum') || metricStat(b, 'tAcd', 'sum')); }, 0);
  var tWaitCount = convBuckets.reduce(function (s, b) { return s + (metricStat(b, 'tAnswered', 'count') || metricStat(b, 'tAcd', 'count')); }, 0);

  setKpiValue('tma', tHandleCount ? msToShort(tHandleSum / tHandleCount) : '—', 'Tempo médio de atendimento');
  setKpiValue('tme', tWaitCount ? msToShort(tWaitSum / tWaitCount) : '—', 'Tempo médio de espera');
  setKpiValue('volume', String(totalOffered), 'Chamados oferecidos no período');

  var userBuckets = (usersJson.results && usersJson.results[0] && usersJson.results[0].data) || [];
  var unavailLabels = userBuckets.map(function (b) { return formatHourLabel(b.interval); });
  var unavailPct = userBuckets.map(function (b) { return +unavailabilityPercent(b).toFixed(1); });
  var avgUnavail = unavailPct.length ? unavailPct.reduce(function (a, b) { return a + b; }, 0) / unavailPct.length : 0;
  setKpiValue('indisponibilidade', avgUnavail.toFixed(1).replace('.', ',') + '%', 'Média do período');

  drawCockpitCharts({
    mainLabels: mainLabels, volume: volume, tmaMin: tmaMin,
    queueLabels: queueRows.map(function (r) { return r.name; }),
    queueData: queueRows.map(function (r) { return r.nOffered; }),
    unavailLabels: unavailLabels, unavailPct: unavailPct,
    donutData: [totalAnswered, totalAbandon]
  });
}

/* ============================================================
   PERFIL DO TÉCNICO — MODAL GRANDE COM ABAS
   ============================================================ */
var PROFILE_TABS = [
  { id: 'geral', label: 'Visão Geral' },
  { id: 'filas', label: 'Matriz de Filas' },
  { id: 'metricas', label: 'Métricas e Metas' },
  { id: 'treinamentos', label: 'Treinamentos' },
  { id: 'timeline', label: 'Linha do Tempo' },
  { id: 'tarefas', label: 'Tarefas' }
];

var TAB_BTN_BASE = 'px-3.5 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition-all duration-200 ';
var TAB_BTN_ACTIVE = 'bg-trorange text-white shadow-sm';
var TAB_BTN_INACTIVE = 'text-gray-600 hover:text-trblue hover:bg-trbg';
function profileTabButton(tab, active) {
  return '<button type="button" data-action="switch-tab" data-tab="' + tab.id + '" class="' + TAB_BTN_BASE + (active ? TAB_BTN_ACTIVE : TAB_BTN_INACTIVE) + '">' + tab.label + '</button>';
}

/* Corpo de cada aba, isolado do "casco" do modal (cabeçalho + barra de abas)
   para permitir atualização parcial do DOM (ver refreshProfileTabContent). */
function computeProfileTabBody(tech, tab) {
  switch (tab) {
    case 'filas': return tabFilas(tech);
    case 'metricas': return tabMetricas(tech);
    case 'treinamentos': return tabTreinamentos(tech);
    case 'timeline': return tabTimeline(tech);
    case 'tarefas': return tabTarefas(tech);
    default: return tabGeral(tech);
  }
}

/* Atualiza só o conteúdo da aba ativa (não mexe no cabeçalho nem na barra de
   abas), evitando re-renderizar o modal inteiro e re-disparar a animação de
   entrada a cada interação (toggle de fila, salvar métricas, registrar ação...). */
function refreshProfileTabContent() {
  if (!session.profile) return;
  var tech = getTechnicianById(session.profile.techId);
  if (!tech) { closeModal(); return; }
  var content = document.getElementById('profile-tab-content');
  if (content) content.innerHTML = computeProfileTabBody(tech, session.profile.tab);
}

/* Troca apenas as classes dos botões de aba para refletir qual está ativa. */
function updateProfileTabButtons(activeTab) {
  var bar = document.getElementById('profile-tabs-bar');
  if (!bar) return;
  bar.querySelectorAll('[data-action="switch-tab"]').forEach(function (btn) {
    btn.className = TAB_BTN_BASE + (btn.dataset.tab === activeTab ? TAB_BTN_ACTIVE : TAB_BTN_INACTIVE);
  });
}

function tabGeral(tech) {

  var pct = m.metaAtendimentos ? Math.round((m.atendimentosMes / m.metaAtendimentos) * 100) : 0;
  var filaChips = tech.filas.length ? tech.filas.map(function (fid) { var q = getQueueById(fid); return q ? '<span class="bg-trbg border border-gray-200 text-gray-700 text-xs px-2.5 py-1 rounded-full">' + escapeHtml(q.codigo) + '</span>' : ''; }).join('') : '<span class="text-sm text-gray-500 italic">Nenhuma fila vinculada.</span>';
  return '' +
    '<div class="flex flex-col gap-5">' +
      '<div class="flex flex-wrap items-start gap-4">' +
        '<span class="w-16 h-16 rounded-full bg-trorange text-white flex items-center justify-center font-bold text-xl shrink-0">' + escapeHtml(tech.avatarIniciais) + '</span>' +
        '<div class="flex-1 min-w-[200px]">' +
          '<h3 class="text-lg font-bold text-trblue">' + escapeHtml(tech.nome) + '</h3>' +
          '<p class="text-sm text-gray-500">' + escapeHtml(tech.cargo) + ' &middot; Setor ' + escapeHtml(tech.setor) + ' &middot; ' + escapeHtml(tech.tempoDeCasa) + ' de casa</p>' +
        '</div>' +
        '<div class="flex gap-2">' +
          '<button type="button" data-action="open-edit-tech-modal" data-tech-id="' + tech.id + '" class="' + BTN_GHOST + '">' + icon('edit', 'w-4 h-4') + 'Editar dados</button>' +
          '<button type="button" data-action="request-delete-technician" data-tech-id="' + tech.id + '" class="' + BTN_DANGER + '">' + icon('trash', 'w-4 h-4') + 'Excluir</button>' +
        '</div>' +
      '</div>' +

      '<div class="' + CARD_CLS + ' p-5">' +
        '<h4 class="text-sm font-bold text-trblue mb-3">Resumo executivo</h4>' +
        '<form data-action="submit-summary" class="flex flex-col gap-3">' +
          '<textarea name="resumoExecutivo" rows="3" class="' + INPUT_CLS + '" placeholder="Resumo sobre o perfil e momento do técnico...">' + escapeHtml(tech.resumoExecutivo) + '</textarea>' +
          '<button type="submit" class="' + BTN_SECONDARY + ' self-start">Salvar resumo</button>' +
        '</form>' +
      '</div>' +

      '<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">' +
        '<div class="' + CARD_CLS + ' p-4 text-center"><div class="text-xl font-extrabold text-trblue">' + m.atendimentosMes + '</div><div class="text-[11px] text-gray-500 mt-0.5">Atend. / ' + m.metaAtendimentos + '</div></div>' +
        '<div class="' + CARD_CLS + ' p-4 text-center"><div class="text-xl font-extrabold text-trblue">' + pct + '%</div><div class="text-[11px] text-gray-500 mt-0.5">Da meta</div></div>' +
        '<div class="' + CARD_CLS + ' p-4 text-center"><div class="text-xl font-extrabold text-trblue">' + m.slaPercentual + '%</div><div class="text-[11px] text-gray-500 mt-0.5">SLA</div></div>' +
        '<div class="' + CARD_CLS + ' p-4 text-center"><div class="text-xl font-extrabold text-trblue">' + m.csat + '</div><div class="text-[11px] text-gray-500 mt-0.5">CSAT / 5</div></div>' +
      '</div>' +

      '<div class="' + CARD_CLS + ' p-5">' +
        '<h4 class="text-sm font-bold text-trblue mb-3">Filas atendidas <span class="font-normal text-gray-500">(gerencie na aba Matriz de Filas)</span></h4>' +
        '<div class="flex flex-wrap gap-2">' + filaChips + '</div>' +
      '</div>' +
    '</div>';
}

function tabFilas(tech) {
  var byCat = {};
  QUEUES.forEach(function (q) { (byCat[q.categoria] = byCat[q.categoria] || []).push(q); });
  var sections = Object.keys(byCat).map(function (cat) {
    var rows = byCat[cat].map(function (q) {
      var active = tech.filas.indexOf(q.id) !== -1;
      return '' +
        '<div class="flex items-center justify-between gap-3 py-2.5 border-b border-gray-100 last:border-0">' +
          '<div class="min-w-0"><span class="font-semibold text-trblue text-sm">' + escapeHtml(q.codigo) + '</span><p class="text-xs text-gray-500 truncate">' + escapeHtml(q.descricao) + '</p></div>' +
          toggleSwitch(active, 'data-action="toggle-fila" data-fila-id="' + q.id + '"') +
        '</div>';
    }).join('');
    return '<div class="' + CARD_CLS + ' p-5"><h4 class="text-xs font-bold uppercase tracking-wide text-gray-500 mb-1">' + escapeHtml(cat) + '</h4>' + rows + '</div>';
  }).join('<div class="h-4"></div>');
  return '<div class="flex flex-col">' + sections + '</div>';
}

        '<div class="' + CARD_CLS + ' p-4"><div class="text-xs font-semibold uppercase text-gray-500">TME</div><div class="text-2xl font-extrabold text-trblue mt-1">' + m.tmeMinutos + ' <span class="text-sm font-normal text-gray-500">min</span></div></div>' +

        '<div class="min-w-0"><span class="text-sm font-medium text-gray-900">' + escapeHtml(e.nome) + '</span>' + (e.data ? '<span class="text-xs text-gray-500 ml-2">' + formatDateBr(e.data) + '</span>' : '') + '</div>' +

      '<div class="' + CARD_CLS + ' p-5"><h5 class="text-xs font-bold uppercase text-gray-500 mb-1">Agendados</h5>' + (groups.agendado.length ? groups.agendado.map(row).join('') : '<p class="text-sm text-gray-500 italic py-1">Nenhum treinamento agendado.</p>') + '</div>' +

    '</div>';

function tabTimeline(tech) {
  var items = tech.timeline.length ? tech.timeline.map(function (e) {

      '<li class="relative pl-5 pb-5 border-l-2 border-gray-200 last:pb-0">' +

        '<label class="text-xs font-semibold text-gray-600 flex flex-col gap-1">Data/hora de início<input type="datetime-local" name="inicio" required value="' + nowLocalInputValue() + '" class="' + INPUT_CLS + '" /></label>' +

      '</form>' +
      '<ul class="' + CARD_CLS + ' p-5">' + items + '</ul>' +
    '</div>';
}

function tabTarefas(tech) {
  function card(tk) {
    var isDone = tk.status === 'concluida';
    return '' +
      '<div class="' + CARD_CLS + ' p-3.5 flex items-start gap-2">' +
        '<div class="flex-1 min-w-0"><p class="text-sm font-medium text-gray-900 ' + (isDone ? 'line-through text-gray-500' : '') + '">' + escapeHtml(tk.titulo) + '</p><p class="text-[11px] text-gray-500 mt-0.5">' + formatDateBr(tk.criadaEm) + '</p></div>' +
        '<div class="flex items-center gap-1 shrink-0">' +
          (isDone
            ? '<button type="button" data-action="set-task-status" data-task-id="' + tk.id + '" data-status="andamento" class="text-trblue hover:text-trbluelight" title="Reabrir">' + icon('undo', 'w-4 h-4') + '</button>'
            : '<button type="button" data-action="set-task-status" data-task-id="' + tk.id + '" data-status="concluida" class="text-emerald-600 hover:text-emerald-700" title="Concluir">' + icon('check', 'w-4 h-4') + '</button>') +
          '<button type="button" data-action="delete-task" data-task-id="' + tk.id + '" class="text-gray-400 hover:text-red-600" title="Remover">' + icon('close', 'w-4 h-4') + '</button>' +

      '</div>';
  }
  var andamento = tech.tarefas.filter(function (t) { return t.status === 'andamento'; });

  return '' +
    '<div class="flex flex-col gap-4">' +
      '<form data-action="submit-add-task" class="flex gap-2">' +
        '<input type="text" name="titulo" required placeholder="Descreva a nova tarefa..." class="' + INPUT_CLS + ' flex-1" />' +
        '<button type="submit" class="' + BTN_PRIMARY + ' shrink-0">' + icon('plus', 'w-4 h-4') + 'Atribuir</button>' +
      '</form>' +
      '<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">' +
        '<div><h4 class="text-xs font-bold uppercase text-gray-500 mb-2">Em andamento (' + andamento.length + ')</h4><div class="flex flex-col gap-2">' + (andamento.length ? andamento.map(card).join('') : '<p class="text-sm text-gray-500 italic">Nenhuma tarefa em andamento.</p>') + '</div></div>' +
        '<div><h4 class="text-xs font-bold uppercase text-gray-500 mb-2">Concluídas (' + concluidas.length + ')</h4><div class="flex flex-col gap-2">' + (concluidas.length ? concluidas.map(card).join('') : '<p class="text-sm text-gray-500 italic">Nenhuma tarefa concluída ainda.</p>') + '</div></div>' +
      '</div>' +
    '</div>';

function ProfileModal() {
  var tech = session.profile ? getTechnicianById(session.profile.techId) : null;
  if (!tech) { session.profile = null; session.modal = null; return ''; }
  var tab = session.profile.tab || 'geral';
  var tabsHtml = PROFILE_TABS.map(function (t) { return profileTabButton(t, t.id === tab); }).join('');
  var body = computeProfileTabBody(tech, tab);
  var inner = modalHeader(tech.nome, tech.cargo + ' · Setor ' + tech.setor) +
    '<div id="profile-tabs-bar" class="shrink-0 px-4 sm:px-6 pt-4 pb-3 flex gap-1.5 overflow-x-auto border-b border-gray-200 bg-trbg">' + tabsHtml + '</div>' +
    '<div id="profile-tab-content" class="flex-1 min-h-0 overflow-y-auto p-4 sm:p-6">' + body + '</div>';
  return modalShell(inner, 'max-w-4xl', { fixedHeight: true });
}

function pendDiasBadge(dias) {
  var cls = dias > 5 ? 'bg-red-100 text-red-700 font-bold' : (dias >= 3 ? 'bg-amber-100 text-amber-700 font-semibold' : 'bg-gray-100 text-gray-600 font-medium');
  return '<span class="inline-flex items-center justify-center min-w-[2.25rem] px-2 py-1 rounded-full text-xs ' + cls + '">' + dias + '</span>';
}
function computePendenciasStats(list) {
  var total = list.length;
  var criticos = list.filter(function (p) { return p.dias > 5; }).length;
  var porResponsavel = {};
  list.forEach(function (p) { porResponsavel[p.responsavel] = (porResponsavel[p.responsavel] || 0) + 1; });
  var topAcumuladores = Object.keys(porResponsavel).map(function (nome) { return { nome: nome, total: porResponsavel[nome] }; })
    .sort(function (a, b) { return b.total - a.total; }).slice(0, 3);
  var porModulo = {};
  list.forEach(function (p) { porModulo[p.modulo] = (porModulo[p.modulo] || 0) + 1; });
  var moduloCritico = Object.keys(porModulo).reduce(function (top, m) { return (!top || porModulo[m] > porModulo[top]) ? m : top; }, null);
  return { total: total, criticos: criticos, topAcumuladores: topAcumuladores, moduloCritico: moduloCritico, moduloCriticoQtd: moduloCritico ? porModulo[moduloCritico] : 0 };
}
function topAcumuladoresHtml(top3) {
  if (!top3.length) return '<p class="text-sm text-gray-500 italic">Sem dados.</p>';
  var medals = ['bg-amber-400', 'bg-gray-300', 'bg-amber-700'];
  return '<ul class="flex flex-col gap-2">' + top3.map(function (t, i) {
    return '' +
      '<li class="flex items-center gap-2.5">' +
        '<span class="w-6 h-6 rounded-full ' + (medals[i] || 'bg-gray-200') + ' text-white text-[11px] font-bold flex items-center justify-center shrink-0">' + (i + 1) + '</span>' +
        '<span class="flex-1 text-sm text-gray-800 truncate">' + escapeHtml(t.nome) + '</span>' +
        '<span class="text-xs font-bold text-trblue">' + t.total + '</span>' +
      '</li>';
  }).join('') + '</ul>';
}

  return '' +

      '<div class="' + CARD_CLS + ' p-5">' +
        '<span class="text-xs font-semibold uppercase tracking-wide text-gray-500">Top acumuladores</span>' +

  if (session.view === 'tecnicos') {
    root.innerHTML = TecnicosView();
    updateTecnicosData();
  } else if (session.view === 'agenda') {
    root.innerHTML = AgendaView();
  } else if (session.view === 'planilhas') {
    root.innerHTML = PlanilhasView();
    renderSheetGrid();
  } else if (session.view === 'pendencias') {
    root.innerHTML = PendenciasView();
    updatePendenciasView();
  } else {
    // 'dashboard' (padrão) agora é o Cockpit OPS — ver requisito de
    // reestruturação: o item "Dashboard" do menu abre direto o BI.
    root.innerHTML = CockpitView();
    renderCockpitCharts();
  }
}
function renderModal() {
  var root = document.getElementById('modal-root');
  if (!session.modal) { root.innerHTML = ''; return; }
  switch (session.modal.type) {
    case 'profile': root.innerHTML = ProfileModal(); break;
    case 'add-tech': root.innerHTML = AddTechModal(); break;
    case 'edit-tech': root.innerHTML = EditTechModal(); break;
    case 'confirm': root.innerHTML = ConfirmModal(); break;
    case 'add-sheet': root.innerHTML = AddSpreadsheetModal(); break;
    case 'sheet-detail': root.innerHTML = SpreadsheetDetailModal(); break;
    default: root.innerHTML = '';
  }
}
function openProfile(techId, tab) { session.modal = { type: 'profile' }; session.profile = { techId: techId, tab: tab || 'geral' }; session.editingMetrics = false; session.scheduleFormOpen = false; renderModal(); }
function closeModal() { session.modal = null; session.profile = null; session.editingMetrics = false; session.scheduleFormOpen = false; renderModal(); }

/* ============================================================
   EVENTOS (delegação global)
   ============================================================ */
function formDataToObject(form) { var fd = new FormData(form), o = {}; fd.forEach(function (v, k) { o[k] = v; }); return o; }

document.addEventListener('click', async function (e) {
  if (e.target && e.target.getAttribute && e.target.getAttribute('data-role') === 'overlay') { closeModal(); return; }
  var el = e.target.closest && e.target.closest('[data-action]');
  if (!el) return;
  var action = el.dataset.action;

  switch (action) {
    case 'select-manager':
      session.managerId = el.dataset.managerId; session.view = 'dashboard'; renderAll(); break;
    case 'logout':
      session.managerId = null; closeModal(); renderAll(); break;
    case 'reset-demo':
      openConfirm({ title: 'Restaurar dados de demonstração', message: 'Todos os técnicos e planilhas no Firestore serão apagados e recriados com a carga inicial. Deseja continuar?', confirmLabel: 'Restaurar', confirmAction: 'reset-demo' });
      break;
    case 'nav-goto':
      // navItem() já calcula o destaque a partir de session.view === view; o
      // que faltava era re-renderizar o próprio menu após a troca (senão o
      // laranja só aparecia depois de outra ação que disparasse renderAll()).
      session.view = el.dataset.view; renderNav(); renderView(); break;
    case 'refresh-cockpit':
      loadCockpitGenesysData(); break;
    case 'open-profile':
      openProfile(el.dataset.techId); break;
    case 'close-modal':
      closeModal(); break;
    case 'switch-tab':
      session.profile.tab = el.dataset.tab; session.editingMetrics = false; session.scheduleFormOpen = false;
      updateProfileTabButtons(session.profile.tab); refreshProfileTabContent();
      break;
    case 'open-add-tech-modal':
      session.modal = { type: 'add-tech' }; renderModal(); break;
    case 'open-edit-tech-modal':
      session.modal = { type: 'edit-tech', techId: el.dataset.techId }; renderModal(); break;
    case 'request-delete-technician': {
      var t = getTechnicianById(el.dataset.techId);
      if (t) openConfirm({ title: 'Excluir técnico', message: 'Excluir "' + t.nome + '" da equipe? Esta ação não pode ser desfeita.', confirmLabel: 'Excluir técnico', confirmAction: 'delete-technician', payload: { techId: t.id } });
      break;
    }
    // As mutações abaixo (toggle-fila, treinamentos, timeline, tarefas) só
    // gravam no Firestore. A UI é atualizada quando o onSnapshot ecoa a
    // mudança de volta (handleTechniciansUpdate), não aqui.
    case 'toggle-fila': {
      var techId = el.dataset.techId || (session.profile && session.profile.techId);
      toggleFila(techId, el.dataset.filaId);
      break;
    }
    case 'toggle-training-matrix': {
      var isDone = el.getAttribute('aria-checked') !== 'true';
      setTrainingMatrixCell(el.dataset.techId, el.dataset.nome, isDone);
      break;
    }
    case 'edit-metrics': session.editingMetrics = true; refreshProfileTabContent(); break;
    case 'cancel-edit-metrics': session.editingMetrics = false; refreshProfileTabContent(); break;
    case 'toggle-schedule-form': session.scheduleFormOpen = true; refreshProfileTabContent(); break;
    case 'cancel-schedule-training': session.scheduleFormOpen = false; refreshProfileTabContent(); break;
    case 'mark-training-complete':
      markTrainingComplete(session.profile.techId, el.dataset.entryId); break;
    case 'delete-training-entry':
      deleteTrainingEntry(session.profile.techId, el.dataset.entryId); break;
    case 'delete-timeline':
      deleteTimelineEntry(session.profile.techId, el.dataset.entryId); break;
    case 'set-task-status':
      setTaskStatus(session.profile.techId, el.dataset.taskId, el.dataset.status); break;
    case 'delete-task':
      deleteTask(session.profile.techId, el.dataset.taskId); break;
    case 'open-add-sheet-modal':
      session.addSheetSource = 'link'; session.modal = { type: 'add-sheet' }; renderModal(); break;
    case 'switch-sheet-source': {
      session.addSheetSource = el.dataset.source;
      var sourceTabs = document.getElementById('add-sheet-source-tabs');
      if (sourceTabs) sourceTabs.querySelectorAll('[data-action="switch-sheet-source"]').forEach(function (btn) {
        btn.className = 'flex-1 ' + TAB_BTN_BASE + (btn.dataset.source === session.addSheetSource ? TAB_BTN_ACTIVE : TAB_BTN_INACTIVE);
      });
      var sourceField = document.getElementById('add-sheet-source-field');
      if (sourceField) sourceField.innerHTML = addSheetSourceField();
      break;
    }
    case 'open-spreadsheet':
      session.modal = { type: 'sheet-detail', sheetId: el.dataset.sheetId }; renderModal(); break;
    case 'request-remove-spreadsheet': {
      var sh = STATE.spreadsheets.find(function (s) { return s.id === el.dataset.sheetId; });
      openConfirm({ title: 'Remover planilha', message: 'Remover "' + (sh ? sh.nome : 'planilha') + '"? Esta ação não pode ser desfeita.', confirmLabel: 'Remover', confirmAction: 'remove-spreadsheet', payload: { sheetId: el.dataset.sheetId } });
      break;
    }
    case 'confirm-yes': {
      var pending = session.modal;
      closeModal();
      if (pending.confirmAction === 'delete-technician') {
        var okDel = await deleteTechnician(pending.payload.techId);
        if (okDel) showToast('Técnico excluído.');
      } else if (pending.confirmAction === 'remove-spreadsheet') {
        var okRemove = await deleteSpreadsheetRecord(pending.payload.sheetId);
        if (okRemove) showToast('Planilha removida.');
      } else if (pending.confirmAction === 'reset-demo') {
        showToast('Restaurando dados de demonstração...', 'info');
        var okReset = await resetDemoData();
        if (okReset) { session.view = 'dashboard'; renderView(); showToast('Dados de demonstração restaurados.'); }
      }
      break;
    }
    default: break;
  }
});

document.addEventListener('input', function (e) {
  if (e.target.id === 'dash-search') updateTecnicosData();
  if (e.target.id === 'sheet-search') renderSheetGrid();
  if (e.target.id === 'pend-search') updatePendenciasView();
});

document.addEventListener('keydown', function (e) {
  if (e.target.matches && e.target.matches('[data-action="open-profile"]') && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault(); openProfile(e.target.dataset.techId);
  }
  if (e.key === 'Escape' && session.modal) closeModal();
});

document.addEventListener('focusout', function (e) {
  if (e.target.matches && e.target.matches('[data-action="edit-generic-cell"]')) {
    var sheetId = e.target.dataset.sheetId, r = Number(e.target.dataset.row), c = Number(e.target.dataset.col);
    var value = e.target.textContent;
    var sheet = STATE.spreadsheets.find(function (s) { return s.id === sheetId; });
    if (!sheet) return;
    var newDados = sheet.dados.map(function (row) { return row.slice(); });
    newDados[r][c] = value;
    syncSpreadsheetData(sheetId, { dados: newDados }).then(function (ok) { if (ok) showToast('Planilha salva.'); });
  }
});

document.addEventListener('submit', async function (e) {
  var form = e.target;
  if (!form.dataset || !form.dataset.action) return;
  e.preventDefault();
  var data = formDataToObject(form);

  switch (form.dataset.action) {
    case 'genesys-timeline-lookup': {
      var lookupBtn = form.querySelector('button[type="submit"]'); var lookupLabel = lookupBtn.textContent;
      var resultRoot = document.getElementById('genesys-timeline-result');
      lookupBtn.disabled = true; lookupBtn.textContent = 'Buscando...';
      if (resultRoot) resultRoot.innerHTML = '<p class="text-sm text-gray-500 italic">Buscando timeline...</p>';
      try {
        var timelineEntries = await fetchUserRoutingTimeline(data.userId, genesysDashboardInterval());
        renderGenesysTimelineResult(timelineEntries);
      } catch (timelineErr) {
        console.error('Falha ao buscar timeline do técnico:', timelineErr);
        if (resultRoot) resultRoot.innerHTML = '<p class="text-sm text-red-600">' + escapeHtml(timelineErr.isGenesysAuthError ? timelineErr.message : 'Não foi possível buscar a timeline. Verifique o User ID e o token.') + '</p>';
      }
      lookupBtn.disabled = false; lookupBtn.textContent = lookupLabel;
      break;
    }
    case 'submit-add-tech': {
      var manager = getCurrentManager();
      var submitBtnAdd = form.querySelector('button[type="submit"]'); var labelAdd = submitBtnAdd.textContent;
      submitBtnAdd.disabled = true; submitBtnAdd.textContent = 'Salvando...';
      var okAdd = await addTechnician({ nome: data.nome, cargo: data.cargo, setor: manager.setor, tempoDeCasa: data.tempoDeCasa, metaAtendimentos: data.metaAtendimentos, resumoExecutivo: data.resumoExecutivo });
      if (okAdd) { closeModal(); showToast('Técnico adicionado.'); }
      else { submitBtnAdd.disabled = false; submitBtnAdd.textContent = labelAdd; }
      break;
    }
    case 'submit-edit-tech': {
      var submitBtnEdit = form.querySelector('button[type="submit"]'); var labelEdit = submitBtnEdit.textContent;
      submitBtnEdit.disabled = true; submitBtnEdit.textContent = 'Salvando...';
      var okEdit = await updateTechnician(form.dataset.techId, { nome: data.nome, cargo: data.cargo, tempoDeCasa: data.tempoDeCasa });
      if (okEdit) { closeModal(); showToast('Dados atualizados.'); }
      else { submitBtnEdit.disabled = false; submitBtnEdit.textContent = labelEdit; }
      break;
    }
    case 'submit-summary':
      updateTechnician(session.profile.techId, { resumoExecutivo: data.resumoExecutivo }).then(function (ok) { if (ok) showToast('Resumo salvo.'); });
      break;
    case 'submit-metrics':
      updateMetrics(session.profile.techId, { atendimentosMes: Number(data.atendimentosMes) || 0, metaAtendimentos: Number(data.metaAtendimentos) || 0, slaPercentual: Number(data.slaPercentual) || 0, csat: Number(data.csat) || 0, tmeMinutos: Number(data.tmeMinutos) || 0 }).then(function (ok) { if (ok) showToast('Métricas atualizadas.'); });
      session.editingMetrics = false; refreshProfileTabContent();
      break;
    case 'submit-timeline':
      addTimelineEntry(session.profile.techId, { tipo: data.tipo, inicio: data.inicio, fim: data.fim, observacoes: data.observacoes }).then(function (ok) { if (ok) showToast('Ação registrada.'); });
      break;
    case 'submit-schedule-training':
      scheduleTraining(session.profile.techId, data.nome, data.data).then(function (ok) { if (ok) showToast('Treinamento agendado.'); });
      session.scheduleFormOpen = false; refreshProfileTabContent();
      break;
    case 'submit-add-task':
      addTask(session.profile.techId, data.titulo); break;
    case 'submit-add-sheet': {
      var submitBtnSheet = form.querySelector('button[type="submit"]');
      if (session.addSheetSource === 'upload') {
        var file = form.querySelector('input[name="arquivo"]').files[0];
        if (!file) { showToast('Selecione um arquivo para importar.', 'error'); break; }
        submitBtnSheet.disabled = true; submitBtnSheet.textContent = 'Importando...';
        try {
          var dadosExcel = await readSpreadsheetFile(file);
          var okExcel = await createExcelImportRecord(data.nome, dadosExcel);
          if (okExcel) { closeModal(); showToast('Planilha importada.'); }
          else { submitBtnSheet.disabled = false; submitBtnSheet.textContent = 'Importar / criar'; }
        } catch (err) {
          reportDataError(err, 'Não foi possível ler o arquivo. Verifique se é um .xlsx, .xls ou .csv válido.');
          submitBtnSheet.disabled = false; submitBtnSheet.textContent = 'Importar / criar';
        }
      } else {
        var sheetId = extractGoogleSheetId(data.link);
        if (!sheetId) { showToast('Link do Google Sheets inválido. Copie o link de compartilhamento completo.', 'error'); break; }
        submitBtnSheet.disabled = true; submitBtnSheet.textContent = 'Importando...';
        var okSheet = await createGoogleSheetRecord(data.nome, sheetId);
        if (okSheet) { closeModal(); showToast('Planilha importada.'); }
        else { submitBtnSheet.disabled = false; submitBtnSheet.textContent = 'Importar / criar'; }
      }
      break;
    }
    default: break;
  }
});

/* ============================================================
   INIT — aguarda o módulo Firebase (ver <head>) inicializar o app e o
   Firestore antes de ligar os listeners em tempo real e renderizar.
   ============================================================ */
function bootAfterFirebase() {
  var fb = window.__firestore;
  db = fb.db; fsCollection = fb.collection; fsDoc = fb.doc; fsAddDoc = fb.addDoc; fsUpdateDoc = fb.updateDoc; fsDeleteDoc = fb.deleteDoc; fsOnSnapshot = fb.onSnapshot;
  initFirestoreListeners();
  renderAll();
}
if (window.__firestore) {
  bootAfterFirebase();
} else {
  window.addEventListener('firebase-ready', bootAfterFirebase);
}
</script>
